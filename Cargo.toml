[package]
name = "buffetcar"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "A hardened, single-binary Nex server in Rust"

[features]
nexd-contract = []

[dependencies]
rustix = { version = "1.1", features = ["fs"] }
libc = "0.2"

[[test]]
name = "nexd_contract"
path = "tests/nexd_contract.rs"
required-features = ["nexd-contract"]
