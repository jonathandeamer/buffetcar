name: vuln

# Scheduled (and on-demand) advisory scan. Per-push/PR advisory coverage already
# comes from CI's `cargo deny` (`check advisories licenses bans sources`), so
# this workflow's job is the part CI can't do: re-scan unchanged main on a cron
# so a newly-disclosed CVE on a dependency you aren't touching turns it red
# without a push. Run it by hand anytime with `gh workflow run vuln.yml`.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * 1" # Mondays 07:00 UTC

permissions:
  contents: read

jobs:
  advisories:
    name: cargo deny advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@bb137d7af7e4fb67e5f82a49c4fce4fad40782fe # v2.0.20
        with:
          command: check advisories
