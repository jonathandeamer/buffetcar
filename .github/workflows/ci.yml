name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Cancel superseded in-flight runs. Keyed on ref, so a new push to a PR branch
# cancels that branch's older runs (reclaiming the OpenBSD QEMU minutes), while
# the push-to-main run lives in its own group and is never cancelled — it stays
# the authoritative post-merge health signal for main.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt · clippy · test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test

  openbsd:
    name: fmt · clippy · test (openbsd)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Test in OpenBSD VM
        uses: vmactions/openbsd-vm@fcf799d7ce9c305ad89eabef1fb2fa5c1c42d0ee
        with:
          usesh: true
          # The VM runs scripts as root, but buffetcar refuses to run as root
          # (a security invariant the check/serve contract tests assert), so run
          # the gate as an unprivileged user that owns the synced workspace.
          #
          # Use doas (OpenBSD base) rather than su to drop privileges: OpenBSD su
          # treats `-c` as a login-class, not a command, so `su -l ci -c "cmd"`
          # silently falls into an interactive login shell that blocks on stdin.
          # doas runs the command directly with no shell-parsing ambiguity and
          # preserves the working directory. HOME/PATH are set explicitly so
          # cargo has a writable home and finds the toolchain in /usr/local/bin.
          prepare: |
            pkg_add -I rust rust-rustfmt rust-clippy
            useradd -m -s /bin/ksh ci
            printf 'permit nopass root as ci\n' > /etc/doas.conf
          run: |
            set -eux
            chown -R ci .
            doas -u ci /usr/bin/env \
              HOME=/home/ci \
              PATH=/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin \
              RUST_TEST_THREADS=1 \
              make check < /dev/null

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@bb137d7af7e4fb67e5f82a49c4fce4fad40782fe # v2.0.20
        with:
          command: check advisories licenses bans sources
