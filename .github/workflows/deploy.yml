name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - uses: Swatinem/rust-cache@v2

      - name: Install musl-tools
        run: sudo apt-get install -y musl-tools

      - name: Build
        run: cargo build --release --target x86_64-unknown-linux-musl

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan nex.jonathandeamer.com >> ~/.ssh/known_hosts

      - name: Upload binary
        run: |
          scp -i ~/.ssh/deploy_key \
            target/x86_64-unknown-linux-musl/release/buffetcar \
            admin@nex.jonathandeamer.com:/tmp/buffetcar
          ssh -i ~/.ssh/deploy_key admin@nex.jonathandeamer.com \
            'sudo install -m 755 /tmp/buffetcar /usr/local/bin/buffetcar && rm /tmp/buffetcar'

      - name: Sync content
        run: |
          rsync -az --delete \
            --exclude='.git/' \
            --exclude='target/' \
            --exclude='contrib/' \
            --rsync-path='sudo rsync' \
            -e "ssh -i ~/.ssh/deploy_key" \
            . \
            admin@nex.jonathandeamer.com:/srv/nex/buffetcar/

      - name: Install systemd unit
        run: |
          scp -i ~/.ssh/deploy_key \
            contrib/buffetcar.service \
            admin@nex.jonathandeamer.com:/tmp/buffetcar.service
          ssh -i ~/.ssh/deploy_key admin@nex.jonathandeamer.com \
            'sudo install -m 644 /tmp/buffetcar.service /etc/systemd/system/buffetcar.service && rm /tmp/buffetcar.service && sudo systemctl daemon-reload'

      - name: Restart service
        run: |
          ssh -i ~/.ssh/deploy_key admin@nex.jonathandeamer.com \
            'sudo systemctl restart buffetcar'
